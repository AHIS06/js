<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hitung Jarak Antara Dua Titik Bumi</title>
</head>
<body>
    <h2>Program Hitung Jarak Antara Dua Titik Bumi</h2>

    <h3>Titik A</h3>
    <label>Latitude A : </label><input type="number" id="lat1" step="any" placeholder="-6.200000"><br><br>
    <label>Longitude A: </label><input type="number" id="lon1" step="any" placeholder="106.816666"><br><br>

    <h3>Titik B</h3>
    <label>Latitude B : </label><input type="number" id="lat2" step="any" placeholder="-7.250445"><br><br>
    <label>Longitude B: </label><input type="number" id="lon2" step="any" placeholder="112.768845"><br><br>

    <button onclick="hitungJarak()">Kalkulasi Jarak</button>

    <hr>
    <div id="hasil"></div>

    <script>
        function toRadians(degrees) {
            return degrees * (Math.PI / 180);
        }

        function hitungJarak() {
            // 1. INPUT
            let lat1 = parseFloat(document.getElementById('lat1').value);
            let lon1 = parseFloat(document.getElementById('lon1').value);
            let lat2 = parseFloat(document.getElementById('lat2').value);
            let lon2 = parseFloat(document.getElementById('lon2').value);

            if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) {
                document.getElementById('hasil').innerHTML = "<p style='color:red;'>Harap isi semua koordinat!</p>";
                return;
            }

            // 2. PROCESS (Rumus Haversine)
            const R = 6371.0; // Jari-jari bumi (KM)

            let phi1 = toRadians(lat1);
            let phi2 = toRadians(lat2);
            let deltaPhi = toRadians(lat2 - lat1);
            let deltaLambda = toRadians(lon2 - lon1);

            let a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                    Math.cos(phi1) * Math.cos(phi2) *
                    Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);

            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            let jarakKm = R * c;
            let jarakM = jarakKm * 1000;

            // 3. OUTPUT
            document.getElementById('hasil').innerHTML = `
                <h3>Hasil Kalkulasi:</h3>
                <p><b>Jarak Antara Titik A dan B:</b></p>
                <ul>
                    <li><b>${jarakKm.toFixed(2)} km</b> (Kilometer)</li>
                    <li><b>${jarakM.toFixed(2)} m</b> (Meter)</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
